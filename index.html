<script>
(function checkLibs(){if(typeof LightweightCharts==='undefined'||typeof XLSX==='undefined'){setTimeout(checkLibs,100);return}init()})();

function init(){
const APP_ID=1089,WS_URL=`wss://ws.derivws.com/websockets/v3?app_id=${APP_ID}`,MAX=500000,BATCH=5000;
let chart,series,socket,last=null,rangeStart=null,rangeEnd=null;
window.data=[]; window.sym=''; window.gran=60; window.markers=[];
let data=window.data, sym=window.sym, gran=window.gran, markers=window.markers;
let currentStrategy=null,strategyInterval=null,customStrategyFunc=null,chartReady=false,countdownInterval=null;
let lastProcessedIndex=-1;

// Technical Indicators
function calculateSMA(data, period) {
  const sma = [];
  for (let i = 0; i < data.length; i++) {
    if (i < period - 1) {
      sma.push(null);
    } else {
      let sum = 0;
      for (let j = 0; j < period; j++) {
        sum += data[i - j].close;
      }
      sma.push(sum / period);
    }
  }
  return sma;
}

function calculateEMA(data, period) {
  const ema = [];
  const multiplier = 2 / (period + 1);
  let prevEMA = data[0].close;
  
  for (let i = 0; i < data.length; i++) {
    if (i === 0) {
      ema.push(data[i].close);
    } else {
      const currentEMA = (data[i].close - prevEMA) * multiplier + prevEMA;
      ema.push(currentEMA);
      prevEMA = currentEMA;
    }
  }
  return ema;
}

function calculateRSI(data, period = 14) {
  const rsi = [];
  const gains = [];
  const losses = [];
  
  for (let i = 0; i < data.length; i++) {
    if (i === 0) {
      rsi.push(null);
      continue;
    }
    
    const change = data[i].close - data[i - 1].close;
    gains.push(change > 0 ? change : 0);
    losses.push(change < 0 ? Math.abs(change) : 0);
    
    if (i < period) {
      rsi.push(null);
    } else {
      const avgGain = gains.slice(-period).reduce((a, b) => a + b) / period;
      const avgLoss = losses.slice(-period).reduce((a, b) => a + b) / period;
      
      if (avgLoss === 0) {
        rsi.push(100);
      } else {
        const rs = avgGain / avgLoss;
        rsi.push(100 - (100 / (1 + rs)));
      }
    }
  }
  return rsi;
}

function calculateMACD(data, fastPeriod = 12, slowPeriod = 26, signalPeriod = 9) {
  const fastEMA = calculateEMA(data, fastPeriod);
  const slowEMA = calculateEMA(data, slowPeriod);
  
  const macdLine = fastEMA.map((fast, i) => fast - slowEMA[i]);
  
  const macdData = macdLine.map((val, i) => ({ close: val || 0 }));
  const signalLine = calculateEMA(macdData, signalPeriod);
  
  const histogram = macdLine.map((macd, i) => macd - signalLine[i]);
  
  return { macdLine, signalLine, histogram };
}

// Strategy: Immediate Signal Test (RSI + MA Crossover)
function immediateSignalStrategy(data) {
  const signals = [];
  const sma20 = calculateSMA(data, 20);
  const sma50 = calculateSMA(data, 50);
  const rsi = calculateRSI(data, 14);
  
  for (let i = 50; i < data.length; i++) {
    if (sma20[i] && sma50[i] && rsi[i]) {
      // Buy signal: SMA20 crosses above SMA50 and RSI < 70
      if (sma20[i] > sma50[i] && sma20[i - 1] <= sma50[i - 1] && rsi[i] < 70) {
        signals.push({ time: data[i].time, position: 'belowBar', color: '#0f0', shape: 'arrowUp', text: 'BUY' });
      }
      // Sell signal: SMA20 crosses below SMA50 and RSI > 30
      else if (sma20[i] < sma50[i] && sma20[i - 1] >= sma50[i - 1] && rsi[i] > 30) {
        signals.push({ time: data[i].time, position: 'aboveBar', color: '#f33', shape: 'arrowDown', text: 'SELL' });
      }
    }
  }
  
  return signals;
}

// Strategy: Random Strategy (Multiple Indicators) - Fixed to be deterministic
function randomStrategy(data) {
  const signals = [];
  const ema12 = calculateEMA(data, 12);
  const ema26 = calculateEMA(data, 26);
  const rsi = calculateRSI(data, 14);
  const macd = calculateMACD(data);
  
  for (let i = 30; i < data.length; i++) {
    if (ema12[i] && ema26[i] && rsi[i] && macd.histogram[i]) {
      // Buy signal: EMA12 > EMA26, RSI < 40, MACD histogram positive
      if (ema12[i] > ema26[i] && rsi[i] < 40 && macd.histogram[i] > 0) {
        signals.push({ time: data[i].time, position: 'belowBar', color: '#0f0', shape: 'arrowUp', text: 'BUY' });
      }
      // Sell signal: EMA12 < EMA26, RSI > 60, MACD histogram negative
      else if (ema12[i] < ema26[i] && rsi[i] > 60 && macd.histogram[i] < 0) {
        signals.push({ time: data[i].time, position: 'aboveBar', color: '#f33', shape: 'arrowDown', text: 'SELL' });
      }
      // Additional signals based on RSI extremes (deterministic - removed random)
      else if (rsi[i] < 30 && macd.histogram[i] > 0) {
        signals.push({ time: data[i].time, position: 'belowBar', color: '#0ff', shape: 'circle', text: 'R-BUY' });
      }
      else if (rsi[i] > 70 && macd.histogram[i] < 0) {
        signals.push({ time: data[i].time, position: 'aboveBar', color: '#ff0', shape: 'circle', text: 'R-SELL' });
      }
    }
  }
  
  return signals;
}

// Mark chart as ready for strategies
function markChartReady() {
  chartReady = true;
  console.log('Chart marked as ready for strategy execution');
  if (currentStrategy) {
    applyCurrentStrategy();
  }
}

// Apply current strategy to data - FIXED: Only recalculate all signals on initial load or full data change
function applyCurrentStrategy() {
  if (!chartReady || data.length === 0) return;
  
  let newMarkers = [];
  
  if (currentStrategy === 'immediate') {
    newMarkers = immediateSignalStrategy(data);
    updateStrategyStatus('Active: Immediate Signal Test');
  } else if (currentStrategy === 'random') {
    newMarkers = randomStrategy(data);
    updateStrategyStatus('Active: Random Strategy');
  } else if (currentStrategy === 'custom' && customStrategyFunc) {
    try {
      newMarkers = customStrategyFunc(data) || [];
      updateStrategyStatus('Active: Custom Strategy');
    } catch (err) {
      console.error('Custom strategy error:', err);
      updateStrategyStatus('Error in custom strategy');
      return;
    }
  }
  
  markers = newMarkers;
  series.setMarkers(markers);
  lastProcessedIndex = data.length - 1;
  console.log(`Applied ${currentStrategy} strategy: ${markers.length} signals generated`);
}

// Apply strategy for only new candles - FIXED: Incremental signal updates
function applyStrategyIncremental() {
  if (!chartReady || data.length === 0 || !currentStrategy) return;
  
  // Only process if we have new candles
  if (lastProcessedIndex >= data.length - 1) return;
  
  // For live updates, recalculate signals for the last few candles to ensure accuracy
  // but keep all previous signals intact
  const lookbackCandles = 60; // Enough for indicators to stabilize
  const startIndex = Math.max(0, data.length - lookbackCandles);
  
  // Remove markers from the recalculation range
  const timeThreshold = data[startIndex].time;
  const preservedMarkers = markers.filter(m => m.time < timeThreshold);
  
  let newMarkers = [];
  const recalcData = data.slice(startIndex);
  
  if (currentStrategy === 'immediate') {
    newMarkers = immediateSignalStrategy(recalcData);
  } else if (currentStrategy === 'random') {
    newMarkers = randomStrategy(recalcData);
  } else if (currentStrategy === 'custom' && customStrategyFunc) {
    try {
      newMarkers = customStrategyFunc(recalcData) || [];
    } catch (err) {
      console.error('Custom strategy error:', err);
      return;
    }
  }
  
  // Combine preserved and new markers
  markers = [...preservedMarkers, ...newMarkers];
  series.setMarkers(markers);
  lastProcessedIndex = data.length - 1;
}

// Apply strategy
function applyStrategy(strategyType) {
  currentStrategy = strategyType;
  lastProcessedIndex = -1;
  
  if (strategyInterval) {
    clearInterval(strategyInterval);
    strategyInterval = null;
  }
  
  applyCurrentStrategy();
  
  // Start live signal monitoring - only update incrementally
  strategyInterval = setInterval(() => {
    if (chartReady && data.length > 0) {
      applyStrategyIncremental();
    }
  }, 5000);
}

// Update strategy status display
function updateStrategyStatus(status) {
  document.getElementById('strategyStatus').textContent = status;
}

// Apply custom strategy from textarea
function applyCustomStrategy() {
  const code = document.getElementById('strategyCode').value.trim();
  if (!code) {
    alert('Please paste your strategy code');
    return;
  }
  
  try {
    customStrategyFunc = new Function('data', code + '\n\nif (typeof customStrategy === "function") return customStrategy(data); else return [];');
    currentStrategy = 'custom';
    applyStrategy('custom');
    document.getElementById('strategyModal').classList.remove('show');
  } catch (err) {
    alert('Error in strategy code: ' + err.message);
    console.error(err);
  }
}

// Handle strategy file upload
function handleStrategyFileUpload(e) {
  const file = e.target.files[0];
  if (!file) return;
  
  const reader = new FileReader();
  reader.onload = function(event) {
    const code = event.target.result;
    document.getElementById('strategyCode').value = code;
    document.getElementById('strategyModal').classList.add('show');
  };
  reader.readAsText(file);
}

// Init chart
const container=document.getElementById('chart');
chart=LightweightCharts.createChart(container,{width:container.clientWidth,height:container.clientHeight,layout:{background:{color:'#000'},textColor:'#fff'},grid:{vertLines:{color:'#222'},horzLines:{color:'#222'}},timeScale:{timeVisible:true,secondsVisible:false}});
series=chart.addCandlestickSeries({upColor:'#0f0',downColor:'#f33',borderVisible:false,wickUpColor:'#0f0',wickDownColor:'#f33'});
window.addEventListener('resize',()=>chart.applyOptions({width:container.clientWidth,height:container.clientHeight}));

// Load symbols
const catSel=document.getElementById('cat'),symSel=document.getElementById('sym');
let symbolsData={},firstCandleDates={};
catSel.innerHTML='<option>Loading markets...</option>';
const ws=new WebSocket(WS_URL);
ws.onopen=()=>ws.send(JSON.stringify({active_symbols:'brief',product_type:'basic'}));
ws.onmessage=e=>{
try{
const d=JSON.parse(e.data);
if(d.active_symbols&&Array.isArray(d.active_symbols)){
const cats={};
d.active_symbols.forEach(s=>{
const c=s.market_display_name||s.market||'Other';
if(!cats[c])cats[c]=[];
cats[c].push(s);
symbolsData[s.symbol]=s;
});
catSel.innerHTML='';Object.keys(cats).sort().forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=`${c} (${cats[c].length})`;catSel.appendChild(o)});
catSel.onchange=()=>{
symSel.innerHTML='';
const sc=catSel.value;
(cats[sc]||[]).forEach(s=>{
const o=document.createElement('option');
o.value=s.symbol;
let label=s.display_name;
if(firstCandleDates[s.symbol]){
label+=` (From: ${firstCandleDates[s.symbol]})`;
}
o.textContent=label;
symSel.appendChild(o);
});
};
symSel.onchange=fetchFirstCandle;
catSel.onchange();ws.close();
}else if(d.error){catSel.innerHTML='<option>Error: '+d.error.message+'</option>';ws.close()}
}catch(err){console.error(err)}
};
ws.onerror=()=>{catSel.innerHTML='<option>Connection failed</option>';setTimeout(()=>{catSel.innerHTML='<option>Tap to retry</option>';catSel.onclick=()=>{catSel.onclick=null;location.reload()}},1000)};

// Event listeners
document.getElementById('loadH').onclick=loadHist;
document.getElementById('fetchR').onclick=fetchRange;
document.getElementById('live').onclick=startLive;
document.getElementById('csv').onclick=exportCSV;
document.getElementById('xlsx').onclick=exportXLSX;
document.getElementById('bt').onclick=()=>document.getElementById('drawer').classList.toggle('open');
document.getElementById('runBt').onclick=runBacktest;
document.getElementById('clr').onclick=()=>{document.getElementById('results').textContent='Run a backtest to see results';markers=[];series.setMarkers([])};
symSel.onchange=fetchFirstCandle;
document.getElementById('scrollStart').onclick=()=>{if(data.length>0)chart.timeScale().scrollToPosition(-data.length,false)};
document.getElementById('scrollEnd').onclick=()=>{if(data.length>0)chart.timeScale().scrollToRealTime()};
document.getElementById('df').value='';
document.getElementById('dt').value='';

// Strategy event listeners
document.getElementById('strategyBtn').onclick=()=>document.getElementById('strategyDropdown').classList.toggle('show');
document.getElementById('stratImmediate').onclick=()=>{applyStrategy('immediate');document.getElementById('strategyDropdown').classList.remove('show')};
document.getElementById('stratRandom').onclick=()=>{applyStrategy('random');document.getElementById('strategyDropdown').classList.remove('show')};
document.getElementById('stratPaste').onclick=()=>{document.getElementById('strategyModal').classList.add('show');document.getElementById('strategyDropdown').classList.remove('show')};
document.getElementById('stratUpload').onclick=()=>{document.getElementById('strategyFileInput').click();document.getElementById('strategyDropdown').classList.remove('show')};
document.getElementById('modalCancel').onclick=()=>document.getElementById('strategyModal').classList.remove('show');
document.getElementById('modalApply').onclick=applyCustomStrategy;
document.getElementById('strategyFileInput').onchange=handleStrategyFileUpload;
document.addEventListener('click',e=>{if(!e.target.closest('.strategy-btn'))document.getElementById('strategyDropdown').classList.remove('show')});

// Fetch first available candle date
function fetchFirstCandle(){
const s=symSel.value;
if(!s||s==='Select symbol'||firstCandleDates[s])return;
const ws=new WebSocket(WS_URL);
const veryOldDate=Math.floor(new Date('2000-01-01').getTime()/1000);
ws.onopen=()=>ws.send(JSON.stringify({ticks_history:s,adjust_start_time:1,count:1,start:veryOldDate,granularity:60,style:'candles'}));
ws.onmessage=e=>{
try{
const d=JSON.parse(e.data);
if(d.candles&&d.candles.length>0){
const ts=d.candles[0].epoch;
const dt=new Date(ts*1000).toISOString().split('T')[0];
firstCandleDates[s]=dt;
const opt=Array.from(symSel.options).find(o=>o.value===s);
if(opt)opt.textContent=symbolsData[s].display_name+` (From: ${dt})`;
}
ws.close();
}catch(err){console.error(err);ws.close()}
};
ws.onerror=()=>ws.close();
}

// Render data
function render(){
if(data.length===0)return;
try{
const validData=data.filter(c=>c&&c.time&&!isNaN(c.open)&&!isNaN(c.high)&&!isNaN(c.low)&&!isNaN(c.close));
if(validData.length===0){
console.error('No valid candle data to render');
hideSpinner();
return;
}
series.setData(validData);
document.getElementById('pair').textContent=`${sym} | ${gran}s | ${validData.length} candles`;
document.getElementById('infoTxt').textContent=`Loaded ${validData.length} candles`;
chart.timeScale().fitContent();
markChartReady();
}catch(err){
console.error('Error rendering chart:',err);
hideSpinner();
alert('Error displaying chart data. Please try again.');
}
}

// Show/hide spinner
function showSpinner(txt,sub=''){document.getElementById('spinner').style.display='block';document.getElementById('spinner-text').textContent=txt;document.getElementById('spinner-sub').textContent=sub;document.getElementById('progress-fill').style.width='0%'}
function hideSpinner(){document.getElementById('spinner').style.display='none'}
function updateProgress(pct){document.getElementById('progress-fill').style.width=pct+'%'}
function formatDate(ts){const d=new Date(ts*1000);return d.toLocaleDateString('en-GB')}
function calculateDays(start,end){return Math.ceil((end-start)/86400)}

// Load historical data - FIXED: Continue loading even if batch is not exactly BATCH size
function loadHist(){
const s=symSel.value;
if(!s||s==='Select symbol'){alert('Select a symbol');return}
sym=s;gran=parseInt(document.getElementById('tf').value);

// Run backtest
function runBacktest(){
if(data.length===0){alert('Load data first');return}
const slP=parseFloat(document.getElementById('slP').value)||null;
const tpP=parseFloat(document.getElementById('tpP').value)||null;
const hold=parseInt(document.getElementById('hold').value)||5;
if(!slP&&!tpP){alert('Enter SL% or TP%');return}
markers=[];
let wins=0,losses=0,totalPnL=0;
for(let i=50;i<data.length-hold;i++){
const sma20=data.slice(Math.max(0,i-19),i+1).reduce((a,b)=>a+b.close,0)/Math.min(20,i+1);
const sma50=data.slice(Math.max(0,i-49),i+1).reduce((a,b)=>a+b.close,0)/Math.min(50,i+1);
const prevSma20=data.slice(Math.max(0,i-20),i).reduce((a,b)=>a+b.close,0)/Math.min(20,i);
const prevSma50=data.slice(Math.max(0,i-50),i).reduce((a,b)=>a+b.close,0)/Math.min(50,i);
let side=null;
if(sma20>sma50&&prevSma20<=prevSma50)side='buy';
else if(sma20<sma50&&prevSma20>=prevSma50)side='sell';
if(!side)continue;
const entry=data[i].close;
let exit=null,outcome=null;
for(let j=i+1;j<=Math.min(i+hold,data.length-1);j++){
const c=data[j];
if(side==='buy'){
if(slP&&((entry-c.low)/entry*100)>=slP){exit=entry*(1-slP/100);outcome='loss';break}
if(tpP&&((c.high-entry)/entry*100)>=tpP){exit=entry*(1+tpP/100);outcome='win';break}
}else{
if(slP&&((c.high-entry)/entry*100)>=slP){exit=entry*(1+slP/100);outcome='loss';break}
if(tpP&&((entry-c.low)/entry*100)>=tpP){exit=entry*(1-tpP/100);outcome='win';break}
}
if(j===Math.min(i+hold,data.length-1)){exit=c.close;outcome='hold'}
}
if(!exit)continue;
const pnl=side==='buy'?(exit-entry)/entry*100:(entry-exit)/entry*100;
totalPnL+=pnl;
if(outcome==='win')wins++;else if(outcome==='loss')losses++;
markers.push({time:data[i].time,position:side==='buy'?'belowBar':'aboveBar',color:outcome==='win'?'#0f0':outcome==='loss'?'#f33':'#ff0',shape:side==='buy'?'arrowUp':'arrowDown',text:outcome==='win'?'W':outcome==='loss'?'L':'H'});
}
series.setMarkers(markers);
const total=wins+losses;
const winRate=total>0?(wins/total*100).toFixed(1):0;
document.getElementById('results').innerHTML=`<strong>Backtest Results</strong><br>Trades: ${total}<br>Wins: ${wins} | Losses: ${losses}<br>Win Rate: ${winRate}%<br>Total P&L: ${totalPnL.toFixed(2)}%`;
}
}

<script>
// ============================================================================
// TECHNICAL INDICATORS LIBRARY - 173+ INDICATORS FOR CSV EXPORT
// ============================================================================

// Helper function to safely convert values (preserves zeros!)
function safeValue(val) {
  if (val === null || val === undefined || isNaN(val)) return '';
  return val;
}

// Moving Averages - SMA
function calculateSMA(data, period, priceType = 'close') {
  const sma = [];
  for (let i = 0; i < data.length; i++) {
    if (i < period - 1) {
      sma.push(null);
    } else {
      let sum = 0;
      for (let j = 0; j < period; j++) {
        sum += data[i - j][priceType];
      }
      sma.push(sum / period);
    }
  }
  return sma;
}

// Moving Averages - EMA
function calculateEMA(data, period, priceType = 'close') {
  const ema = [];
  const multiplier = 2 / (period + 1);
  let prevEMA = data[0][priceType];

  for (let i = 0; i < data.length; i++) {
    if (i === 0) {
      ema.push(data[i][priceType]);
    } else {
      const currentEMA = (data[i][priceType] - prevEMA) * multiplier + prevEMA;
      ema.push(currentEMA);
      prevEMA = currentEMA;
    }
  }
  return ema;
}

// RSI Calculation
function calculateRSI(data, period = 14) {
  const rsi = [];
  const gains = [];
  const losses = [];

  for (let i = 0; i < data.length; i++) {
    if (i === 0) {
      rsi.push(null);
      continue;
    }

    const change = data[i].close - data[i - 1].close;
    gains.push(change > 0 ? change : 0);
    losses.push(change < 0 ? Math.abs(change) : 0);

    if (i < period) {
      rsi.push(null);
    } else {
      const avgGain = gains.slice(-period).reduce((a, b) => a + b) / period;
      const avgLoss = losses.slice(-period).reduce((a, b) => a + b) / period;

      if (avgLoss === 0) {
        rsi.push(100);
      } else {
        const rs = avgGain / avgLoss;
        rsi.push(100 - (100 / (1 + rs)));
      }
    }
  }
  return rsi;
}

// MACD Calculation
function calculateMACD(data, fastPeriod = 12, slowPeriod = 26, signalPeriod = 9) {
  const fastEMA = calculateEMA(data, fastPeriod);
  const slowEMA = calculateEMA(data, slowPeriod);

  const macdLine = fastEMA.map((fast, i) => fast - slowEMA[i]);

  const macdData = macdLine.map((val, i) => ({ close: val || 0 }));
  const signalLine = calculateEMA(macdData, signalPeriod);

  const histogram = macdLine.map((macd, i) => macd - signalLine[i]);

  return { macdLine, signalLine, histogram };
}

// Bollinger Bands
function calculateBollingerBands(data, period = 20, stdDev = 2) {
  const sma = calculateSMA(data, period);
  const upper = [];
  const middle = [];
  const lower = [];
  const bandwidth = [];
  const percentB = [];

  for (let i = 0; i < data.length; i++) {
    if (i < period - 1) {
      upper.push(null);
      middle.push(null);
      lower.push(null);
      bandwidth.push(null);
      percentB.push(null);
    } else {
      let sum = 0;
      for (let j = 0; j < period; j++) {
        sum += Math.pow(data[i - j].close - sma[i], 2);
      }
      const std = Math.sqrt(sum / period);
      
      upper.push(sma[i] + stdDev * std);
      middle.push(sma[i]);
      lower.push(sma[i] - stdDev * std);
      
      const bw = (upper[i] - lower[i]) / middle[i] * 100;
      bandwidth.push(bw);
      
      const pb = (data[i].close - lower[i]) / (upper[i] - lower[i]);
      percentB.push(pb);
    }
  }
  return { upper, middle, lower, bandwidth, percentB };
}

// ATR (Average True Range)
function calculateATR(data, period = 14) {
  const tr = [];
  const atr = [];

  for (let i = 0; i < data.length; i++) {
    if (i === 0) {
      tr.push(data[i].high - data[i].low);
    } else {
      const hl = data[i].high - data[i].low;
      const hc = Math.abs(data[i].high - data[i - 1].close);
      const lc = Math.abs(data[i].low - data[i - 1].close);
      tr.push(Math.max(hl, hc, lc));
    }

    if (i < period - 1) {
      atr.push(null);
    } else if (i === period - 1) {
      atr.push(tr.slice(0, period).reduce((a, b) => a + b) / period);
    } else {
      atr.push((atr[i - 1] * (period - 1) + tr[i]) / period);
    }
  }
  return atr;
}

// Stochastic Oscillator
function calculateStochastic(data, kPeriod = 14, dPeriod = 3) {
  const k = [];
  const d = [];

  for (let i = 0; i < data.length; i++) {
    if (i < kPeriod - 1) {
      k.push(null);
      d.push(null);
    } else {
      let highestHigh = -Infinity;
      let lowestLow = Infinity;
      
      for (let j = 0; j < kPeriod; j++) {
        highestHigh = Math.max(highestHigh, data[i - j].high);
        lowestLow = Math.min(lowestLow, data[i - j].low);
      }

      const kValue = highestHigh === lowestLow ? 50 : ((data[i].close - lowestLow) / (highestHigh - lowestLow)) * 100;
      k.push(kValue);

      if (i < kPeriod + dPeriod - 2) {
        d.push(null);
      } else {
        const dValue = k.slice(i - dPeriod + 1, i + 1).reduce((a, b) => a + b) / dPeriod;
        d.push(dValue);
      }
    }
  }
  return { k, d };
}

// CCI (Commodity Channel Index)
function calculateCCI(data, period = 20) {
  const cci = [];
  const tp = data.map(d => (d.high + d.low + d.close) / 3);

  for (let i = 0; i < data.length; i++) {
    if (i < period - 1) {
      cci.push(null);
    } else {
      const sma = tp.slice(i - period + 1, i + 1).reduce((a, b) => a + b) / period;
      const md = tp.slice(i - period + 1, i + 1).map(p => Math.abs(p - sma)).reduce((a, b) => a + b) / period;
      cci.push(md === 0 ? 0 : (tp[i] - sma) / (0.015 * md));
    }
  }
  return cci;
}

// Williams %R
function calculateWilliamsR(data, period = 14) {
  const wr = [];

  for (let i = 0; i < data.length; i++) {
    if (i < period - 1) {
      wr.push(null);
    } else {
      let highestHigh = -Infinity;
      let lowestLow = Infinity;
      
      for (let j = 0; j < period; j++) {
        highestHigh = Math.max(highestHigh, data[i - j].high);
        lowestLow = Math.min(lowestLow, data[i - j].low);
      }

      const wrValue = highestHigh === lowestLow ? -50 : ((highestHigh - data[i].close) / (highestHigh - lowestLow)) * -100;
      wr.push(wrValue);
    }
  }
  return wr;
}

// ROC (Rate of Change)
function calculateROC(data, period = 12) {
  const roc = [];

  for (let i = 0; i < data.length; i++) {
    if (i < period) {
      roc.push(null);
    } else {
      const rocValue = data[i - period].close === 0 ? 0 : ((data[i].close - data[i - period].close) / data[i - period].close) * 100;
      roc.push(rocValue);
    }
  }
  return roc;
}

// OBV (On Balance Volume)
function calculateOBV(data) {
  const obv = [0];

  for (let i = 1; i < data.length; i++) {
    if (data[i].close > data[i - 1].close) {
      obv.push(obv[i - 1] + (data[i].volume || 0));
    } else if (data[i].close < data[i - 1].close) {
      obv.push(obv[i - 1] - (data[i].volume || 0));
    } else {
      obv.push(obv[i - 1]);
    }
  }
  return obv;
}

// ADX (Average Directional Index)
function calculateADX(data, period = 14) {
  const tr = [];
  const plusDM = [];
  const minusDM = [];
  const atr = [];
  const plusDI = [];
  const minusDI = [];
  const dx = [];
  const adx = [];

  for (let i = 0; i < data.length; i++) {
    if (i === 0) {
      tr.push(data[i].high - data[i].low);
      plusDM.push(0);
      minusDM.push(0);
    } else {
      const hl = data[i].high - data[i].low;
      const hc = Math.abs(data[i].high - data[i - 1].close);
      const lc = Math.abs(data[i].low - data[i - 1].close);
      tr.push(Math.max(hl, hc, lc));

      const highDiff = data[i].high - data[i - 1].high;
      const lowDiff = data[i - 1].low - data[i].low;

      plusDM.push((highDiff > lowDiff && highDiff > 0) ? highDiff : 0);
      minusDM.push((lowDiff > highDiff && lowDiff > 0) ? lowDiff : 0);
    }

    if (i < period - 1) {
      atr.push(null);
      plusDI.push(null);
      minusDI.push(null);
      dx.push(null);
      adx.push(null);
    } else if (i === period - 1) {
      const atrVal = tr.slice(0, period).reduce((a, b) => a + b) / period;
      const plusDMAvg = plusDM.slice(0, period).reduce((a, b) => a + b) / period;
      const minusDMAvg = minusDM.slice(0, period).reduce((a, b) => a + b) / period;

      atr.push(atrVal);
      plusDI.push(atrVal === 0 ? 0 : (plusDMAvg / atrVal) * 100);
      minusDI.push(atrVal === 0 ? 0 : (minusDMAvg / atrVal) * 100);

      const dxVal = (plusDI[i] + minusDI[i]) === 0 ? 0 : (Math.abs(plusDI[i] - minusDI[i]) / (plusDI[i] + minusDI[i])) * 100;
      dx.push(dxVal);
      adx.push(null);
    } else {
      const atrVal = (atr[i - 1] * (period - 1) + tr[i]) / period;
      const plusDMSmooth = (plusDM.slice(i - period + 1, i + 1).reduce((a, b) => a + b));
      const minusDMSmooth = (minusDM.slice(i - period + 1, i + 1).reduce((a, b) => a + b));

      atr.push(atrVal);
      plusDI.push(atrVal === 0 ? 0 : (plusDMSmooth / period / atrVal) * 100);
      minusDI.push(atrVal === 0 ? 0 : (minusDMSmooth / period / atrVal) * 100);

      const dxVal = (plusDI[i] + minusDI[i]) === 0 ? 0 : (Math.abs(plusDI[i] - minusDI[i]) / (plusDI[i] + minusDI[i])) * 100;
      dx.push(dxVal);

      if (i < period * 2 - 2) {
        adx.push(null);
      } else if (i === period * 2 - 2) {
        adx.push(dx.slice(period - 1, period * 2 - 1).reduce((a, b) => a + b) / period);
      } else {
        adx.push((adx[i - 1] * (period - 1) + dx[i]) / period);
      }
    }
  }

  return { adx, plusDI, minusDI };
}

// Parabolic SAR
function calculateParabolicSAR(data, afStart = 0.02, afIncrement = 0.02, afMax = 0.2) {
  const sar = [];
  const trend = [];

  let isUpTrend = true;
  let sar_val = data[0].low;
  let ep = data[0].high;
  let af = afStart;

  for (let i = 0; i < data.length; i++) {
    if (i === 0) {
      sar.push(sar_val);
      trend.push(1);
      continue;
    }

    sar_val = sar_val + af * (ep - sar_val);

    if (isUpTrend) {
      if (data[i].low < sar_val) {
        isUpTrend = false;
        sar_val = ep;
        ep = data[i].low;
        af = afStart;
      } else {
        if (data[i].high > ep) {
          ep = data[i].high;
          af = Math.min(af + afIncrement, afMax);
        }
      }
    } else {
      if (data[i].high > sar_val) {
        isUpTrend = true;
        sar_val = ep;
        ep = data[i].high;
        af = afStart;
      } else {
        if (data[i].low < ep) {
          ep = data[i].low;
          af = Math.min(af + afIncrement, afMax);
        }
      }
    }

    sar.push(sar_val);
    trend.push(isUpTrend ? 1 : -1);
  }

  return { sar, trend };
}

// Aroon Indicator
function calculateAroon(data, period = 25) {
  const aroonUp = [];
  const aroonDown = [];

  for (let i = 0; i < data.length; i++) {
    if (i < period - 1) {
      aroonUp.push(null);
      aroonDown.push(null);
    } else {
      let highestIdx = i;
      let lowestIdx = i;

      for (let j = i - period + 1; j <= i; j++) {
        if (data[j].high >= data[highestIdx].high) highestIdx = j;
        if (data[j].low <= data[lowestIdx].low) lowestIdx = j;
      }

      aroonUp.push(((period - (i - highestIdx)) / period) * 100);
      aroonDown.push(((period - (i - lowestIdx)) / period) * 100);
    }
  }

  return { aroonUp, aroonDown };
}

// Support and Resistance Levels
function calculateSupportResistance(data, lookback = 20) {
  const support = [];
  const resistance = [];

  for (let i = 0; i < data.length; i++) {
    if (i < lookback) {
      support.push(null);
      resistance.push(null);
    } else {
      let minLow = Infinity;
      let maxHigh = -Infinity;

      for (let j = i - lookback; j < i; j++) {
        minLow = Math.min(minLow, data[j].low);
        maxHigh = Math.max(maxHigh, data[j].high);
      }

      support.push(minLow);
      resistance.push(maxHigh);
    }
  }

  return { support, resistance };
}

// Pivot Points
function calculatePivotPoints(data) {
  const pivot = [];
  const r1 = [];
  const r2 = [];
  const r3 = [];
  const s1 = [];
  const s2 = [];
  const s3 = [];

  for (let i = 0; i < data.length; i++) {
    if (i === 0) {
      pivot.push(null);
      r1.push(null);
      r2.push(null);
      r3.push(null);
      s1.push(null);
      s2.push(null);
      s3.push(null);
    } else {
      const p = (data[i - 1].high + data[i - 1].low + data[i - 1].close) / 3;
      pivot.push(p);
      r1.push(2 * p - data[i - 1].low);
      r2.push(p + (data[i - 1].high - data[i - 1].low));
      r3.push(data[i - 1].high + 2 * (p - data[i - 1].low));
      s1.push(2 * p - data[i - 1].high);
      s2.push(p - (data[i - 1].high - data[i - 1].low));
      s3.push(data[i - 1].low - 2 * (data[i - 1].high - p));
    }
  }

  return { pivot, r1, r2, r3, s1, s2, s3 };
}

// Linear Regression
function calculateLinearRegression(data, period = 20) {
  const slope = [];
  const intercept = [];
  const rSquared = [];
  const forecast = [];

  for (let i = 0; i < data.length; i++) {
    if (i < period - 1) {
      slope.push(null);
      intercept.push(null);
      rSquared.push(null);
      forecast.push(null);
    } else {
      let sumX = 0;
      let sumY = 0;
      let sumXY = 0;
      let sumXX = 0;

      for (let j = 0; j < period; j++) {
        const x = j;
        const y = data[i - period + 1 + j].close;
        sumX += x;
        sumY += y;
        sumXY += x * y;
        sumXX += x * x;
      }

      const slopeVal = (period * sumXY - sumX * sumY) / (period * sumXX - sumX * sumX);
      const interceptVal = (sumY - slopeVal * sumX) / period;

      slope.push(slopeVal);
      intercept.push(interceptVal);
      forecast.push(slopeVal * (period - 1) + interceptVal);

      let sumSquaredErrors = 0;
      let sumSquaredTotal = 0;
      const meanY = sumY / period;

      for (let j = 0; j < period; j++) {
        const x = j;
        const y = data[i - period + 1 + j].close;
        const predicted = slopeVal * x + interceptVal;
        sumSquaredErrors += Math.pow(y - predicted, 2);
        sumSquaredTotal += Math.pow(y - meanY, 2);
      }

      const r2 = sumSquaredTotal === 0 ? 0 : 1 - (sumSquaredErrors / sumSquaredTotal);
      rSquared.push(r2);
    }
  }

  return { slope, intercept, rSquared, forecast };
}

// Fibonacci Retracement Levels
function calculateFibonacci(data, lookback = 50) {
  const fib236 = [];
  const fib382 = [];
  const fib500 = [];
  const fib618 = [];
  const fib786 = [];

  for (let i = 0; i < data.length; i++) {
    if (i < lookback) {
      fib236.push(null);
      fib382.push(null);
      fib500.push(null);
      fib618.push(null);
      fib786.push(null);
    } else {
      let maxHigh = -Infinity;
      let minLow = Infinity;

      for (let j = i - lookback; j < i; j++) {
        maxHigh = Math.max(maxHigh, data[j].high);
        minLow = Math.min(minLow, data[j].low);
      }

      const diff = maxHigh - minLow;
      fib236.push(maxHigh - diff * 0.236);
      fib382.push(maxHigh - diff * 0.382);
      fib500.push(maxHigh - diff * 0.500);
      fib618.push(maxHigh - diff * 0.618);
      fib786.push(maxHigh - diff * 0.786);
    }
  }

  return { fib236, fib382, fib500, fib618, fib786 };
}

// Standard Deviation
function calculateStdDev(data, period = 20) {
  const stdDev = [];

  for (let i = 0; i < data.length; i++) {
    if (i < period - 1) {
      stdDev.push(null);
    } else {
      const prices = [];
      for (let j = 0; j < period; j++) {
        prices.push(data[i - j].close);
      }
      const mean = prices.reduce((a, b) => a + b) / period;
      const variance = prices.reduce((sum, price) => sum + Math.pow(price - mean, 2), 0) / period;
      stdDev.push(Math.sqrt(variance));
    }
  }

  return stdDev;
}

// VWAP (Volume Weighted Average Price)
function calculateVWAP(data) {
  const vwap = [];
  let cumulativeTPV = 0;
  let cumulativeVolume = 0;

  for (let i = 0; i < data.length; i++) {
    const tp = (data[i].high + data[i].low + data[i].close) / 3;
    const volume = data[i].volume || 1;
    cumulativeTPV += tp * volume;
    cumulativeVolume += volume;
    vwap.push(cumulativeVolume === 0 ? tp : cumulativeTPV / cumulativeVolume);
  }

  return vwap;
}

// MFI (Money Flow Index)
function calculateMFI(data, period = 14) {
  const mfi = [];
  const mf = [];

  for (let i = 0; i < data.length; i++) {
    const tp = (data[i].high + data[i].low + data[i].close) / 3;
    const volume = data[i].volume || 1;
    mf.push(tp * volume);

    if (i < period) {
      mfi.push(null);
    } else {
      let positiveFlow = 0;
      let negativeFlow = 0;

      for (let j = i - period + 1; j <= i; j++) {
        if (j > 0) {
          const tpCurr = (data[j].high + data[j].low + data[j].close) / 3;
          const tpPrev = (data[j - 1].high + data[j - 1].low + data[j - 1].close) / 3;
          
          if (tpCurr > tpPrev) {
            positiveFlow += mf[j];
          } else if (tpCurr < tpPrev) {
            negativeFlow += mf[j];
          }
        }
      }

      const mfiValue = negativeFlow === 0 ? 100 : 100 - (100 / (1 + (positiveFlow / negativeFlow)));
      mfi.push(mfiValue);
    }
  }

  return mfi;
}

// Pattern Recognition
function calculatePatterns(data) {
  const higherHigh = [];
  const lowerLow = [];
  const trendDirection = [];

  for (let i = 0; i < data.length; i++) {
    if (i < 2) {
      higherHigh.push(0);
      lowerLow.push(0);
      trendDirection.push(0);
    } else {
      higherHigh.push(data[i].high > data[i - 1].high && data[i - 1].high > data[i - 2].high ? 1 : 0);
      lowerLow.push(data[i].low < data[i - 1].low && data[i - 1].low < data[i - 2].low ? 1 : 0);

      if (data[i].close > data[i - 1].close && data[i - 1].close > data[i - 2].close) {
        trendDirection.push(1);
      } else if (data[i].close < data[i - 1].close && data[i - 1].close < data[i - 2].close) {
        trendDirection.push(-1);
      } else {
        trendDirection.push(0);
      }
    }
  }

  return { higherHigh, lowerLow, trendDirection };
}

  indicators.Pct_From_EMA50 = data.map((d, i) => indicators.EMA_50[i] && indicators.EMA_50[i] !== 0 ? ((d.close - indicators.EMA_50[i]) / indicators.EMA_50[i]) * 100 : null);

  // More crossovers
  indicators.SMA10_Above_SMA20 = data.map((d, i) => indicators.SMA_10[i] && indicators.SMA_20[i] ? (indicators.SMA_10[i] > indicators.SMA_20[i] ? 1 : 0) : null);
  indicators.SMA20_Above_SMA50 = data.map((d, i) => indicators.SMA_20[i] && indicators.SMA_50[i] ? (indicators.SMA_20[i] > indicators.SMA_50[i] ? 1 : 0) : null);
  indicators.SMA50_Above_SMA100 = data.map((d, i) => indicators.SMA_50[i] && indicators.SMA_100[i] ? (indicators.SMA_50[i] > indicators.SMA_100[i] ? 1 : 0) : null);
  indicators.SMA100_Above_SMA200 = data.map((d, i) => indicators.SMA_100[i] && indicators.SMA_200[i] ? (indicators.SMA_100[i] > indicators.SMA_200[i] ? 1 : 0) : null);
  indicators.EMA5_Above_EMA10 = data.map((d, i) => indicators.EMA_5[i] && indicators.EMA_10[i] ? (indicators.EMA_5[i] > indicators.EMA_10[i] ? 1 : 0) : null);
  indicators.EMA12_Above_EMA26 = data.map((d, i) => indicators.EMA_12[i] && indicators.EMA_26[i] ? (indicators.EMA_12[i] > indicators.EMA_26[i] ? 1 : 0) : null);
  indicators.EMA20_Above_EMA50 = data.map((d, i) => indicators.EMA_20[i] && indicators.EMA_50[i] ? (indicators.EMA_20[i] > indicators.EMA_50[i] ? 1 : 0) : null);

  // Price position indicators
  indicators.Close_Above_Open = data.map(d => d.close > d.open ? 1 : 0);
  indicators.High_Equal_Close = data.map(d => Math.abs(d.high - d.close) < 0.00001 ? 1 : 0);
  indicators.Low_Equal_Close = data.map(d => Math.abs(d.low - d.close) < 0.00001 ? 1 : 0);
  indicators.Close_Above_BB_Upper = data.map((d, i) => indicators.BB20_Upper[i] ? (d.close > indicators.BB20_Upper[i] ? 1 : 0) : null);
  indicators.Close_Below_BB_Lower = data.map((d, i) => indicators.BB20_Lower[i] ? (d.close < indicators.BB20_Lower[i] ? 1 : 0) : null);

  // Price momentum
  indicators.Close_2_Candles_Ago = data.map((d, i) => i < 2 ? null : data[i - 2].close);
  indicators.Close_3_Candles_Ago = data.map((d, i) => i < 3 ? null : data[i - 3].close);
  indicators.Price_Change_2_Candles = data.map((d, i) => i < 2 ? null : d.close - data[i - 2].close);
  indicators.Price_Change_3_Candles = data.map((d, i) => i < 3 ? null : d.close - data[i - 3].close);
  indicators.Price_Change_5_Candles = data.map((d, i) => i < 5 ? null : d.close - data[i - 5].close);

  // Candle patterns
  indicators.Doji = data.map(d => Math.abs(d.close - d.open) / (d.high - d.low || 1) < 0.1 ? 1 : 0);
  indicators.Hammer = data.map(d => {
    const body = Math.abs(d.close - d.open);
    const lowerShadow = Math.min(d.open, d.close) - d.low;
    const upperShadow = d.high - Math.max(d.open, d.close);
    return (lowerShadow > body * 2 && upperShadow < body) ? 1 : 0;
  });
  indicators.Shooting_Star = data.map(d => {
    const body = Math.abs(d.close - d.open);
    const lowerShadow = Math.min(d.open, d.close) - d.low;
    const upperShadow = d.high - Math.max(d.open, d.close);
    return (upperShadow > body * 2 && lowerShadow < body) ? 1 : 0;
  });

  // True Range and normalized ATR
  indicators.True_Range = data.map((d, i) => {
    if (i === 0) return d.high - d.low;
    const hl = d.high - d.low;
    const hc = Math.abs(d.high - data[i - 1].close);
    const lc = Math.abs(d.low - data[i - 1].close);
    return Math.max(hl, hc, lc);
  });
  indicators.ATR_Pct_14 = data.map((d, i) => indicators.ATR_14[i] && d.close !== 0 ? (indicators.ATR_14[i] / d.close) * 100 : null);

  console.log(`Calculated ${Object.keys(indicators).length} indicator series`);
  return indicators;
}
